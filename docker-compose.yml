services:
  9router:
    # Built by .github/workflows/docker-master.yml on every fork master push; pin a
    # sha-<commit> tag (not latest) so a redeploy is reproducible, and `docker compose pull`
    # before `up -d` to pick up a new build.
    image: ghcr.io/ngapngap/9router:sha-432b0b8f1d2a503a12aeb5249201a7d6a21e8575
    container_name: 9router
    restart: unless-stopped
    ports:
      - "0.0.0.0:20128:20128"
    volumes:
      - /home/ubuntu/.9router:/app/data
      - /home/ubuntu/.zcode:/home/node/.zcode
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      TZ: Asia/Ho_Chi_Minh
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "127.0.0.1:8787:8787"

volumes:
  9router-data:
    name: 9router-data
