# 9router SaaS — Docker Compose
# Usage: docker compose pull && docker compose up -d
#
# Image build trên GitHub Actions (docker-publish.yml) → ghcr.io.
# VPS chỉ cần pull image + file này + .env — không cần source code hay Node.js.
#
# Port 20130 (SaaS fork) — khác 20128 của 9router gốc.
# Mount volume saas-data vào DATA_DIR (/app/data) để giữ SQLite per-user.
# Kết nối Postgres New-API qua external network (new-api_default).

services:
  9router-saas:
    image: ghcr.io/ngapngap/9router:latest
    container_name: 9router-saas
    restart: unless-stopped
    ports:
      - "20130:20130"
    env_file:
      - .env
    volumes:
      - saas-data:/app/data
    environment:
      - PORT=20130
      # Override SAAS_DATABASE_URL để dùng DNS name postgres-core
      # qua external network new-api_default (không dùng localhost trong container)
      - SAAS_DATABASE_URL=postgresql://root:suX9BKpjFD9-@postgres-core:5432/new-api?sslmode=disable
    networks:
      - default
      - new-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:20130/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  saas-data:
    name: 9router-saas-data

networks:
  new-api:
    external: true
    name: new-api_default
