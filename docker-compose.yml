services:
  9router:
    image: 9router:zcode-test
    container_name: 9router
    restart: unless-stopped
    ports:
      - "0.0.0.0:20128:20128"
    volumes:
      - /home/ubuntu/.9router:/app/data
      - /home/ubuntu/.zcode:/home/node/.zcode
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      TZ: Asia/Ho_Chi_Minh
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "127.0.0.1:8787:8787"

volumes:
  9router-data:
    name: 9router-data
