name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Security audit (npm)
        run: npm audit --audit-level=high || true
        # P12 (#24) MED-1: report CVEs, continue-on-error giai đoạn đầu

      - name: ESLint (scoped — full src lint tracked separately)
        run: npm run lint:ci

      - name: Unit tests
        run: npm run test:ci

      - name: Next build
        env:
          SAAS_ENABLED: "false"
        run: npm run build

  build-saas:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Next build (SAAS_ENABLED=true, mock PG)
        env:
          SAAS_ENABLED: "true"
          SAAS_DATABASE_URL: "postgresql://mock:mock@localhost:5432/mock"
          JWT_SECRET: "ci-test-secret-not-for-prod"
        run: npm run build

      - name: Unit tests (SAAS_ENABLED=true)
        env:
          SAAS_ENABLED: "true"
          SAAS_DATABASE_URL: "postgresql://mock:mock@localhost:5432/mock"
          JWT_SECRET: "ci-test-secret-not-for-prod"
        run: npm run test:ci

  security-scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run Trivy vulnerability scanner (fs mode)
        # P12 (#24) HIGH-2: fail on CRITICAL CVE
        uses: aquasecurity/trivy-action@314ff8b43182423b84c50b1670b0e10f858f2d98 # master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results to GitHub Security tab
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@458d36d7d4f47d0dd16ca424c1d3cda0060f1360 # v3
        with:
          sarif_file: "trivy-results.sarif"
