name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: ESLint (scoped — full src lint tracked separately)
        run: npm run lint:ci

      - name: Unit tests
        run: npm run test:ci

      - name: Next build
        env:
          SAAS_ENABLED: "false"
        run: npm run build

  build-saas:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Next build (SAAS_ENABLED=true, mock PG)
        env:
          SAAS_ENABLED: "true"
          SAAS_DATABASE_URL: "postgresql://mock:mock@localhost:5432/mock"
          JWT_SECRET: "ci-test-secret-not-for-prod"
        run: npm run build

      - name: Unit tests (SAAS_ENABLED=true)
        env:
          SAAS_ENABLED: "true"
          SAAS_DATABASE_URL: "postgresql://mock:mock@localhost:5432/mock"
          JWT_SECRET: "ci-test-secret-not-for-prod"
        run: npm run test:ci

  security-scan:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (fs mode)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          format: "sarif"
          output-file: "trivy-results.sarif"

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
